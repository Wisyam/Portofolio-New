<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wisyam Zain Amanullah - Fullstack Developer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
      @keyframes pulse-glow {
        0%, 100% { text-shadow: 0 0 5px #66726B, 0 0 10px #66726B, 0 0 15px #66726B; opacity: 0.7; }
        50% { text-shadow: 0 0 10px #8F9B93, 0 0 20px #8F9B93, 0 0 30px #8F9B93; opacity: 1; }
      }
      .animate-pulse-glow {
        animation: pulse-glow 4s ease-in-out infinite;
      }
      @keyframes shift-gradient {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .animated-gradient {
        background: radial-gradient(circle at top left, #212D2D, #363F3A, #212D2D);
        background-size: 200% 200%;
        animation: shift-gradient 15s ease infinite;
      }
      @keyframes noise-animation {
        0% { transform: translate(0, 0); }
        10% { transform: translate(-5%, -5%); }
        20% { transform: translate(-10%, 5%); }
        30% { transform: translate(5%, -10%); }
        40% { transform: translate(-5%, 15%); }
        50% { transform: translate(-10%, 5%); }
        60% { transform: translate(15%, 0); }
        70% { transform: translate(0, 10%); }
        80% { transform: translate(-15%, 0); }
        90% { transform: translate(10%, 5%); }
        100% { transform: translate(5%, 0); }
      }
      .noise-overlay {
        position: fixed;
        top: -50%;
        left: -50%;
        right: -50%;
        bottom: -50%;
        width: 200%;
        height: 200%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 250 250' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        background-repeat: repeat;
        background-size: 250px 250px;
        opacity: 0.02;
        z-index: -1;
        pointer-events: none;
        animation: noise-animation 10s steps(10) infinite;
      }
      .card-3d {
        transform-style: preserve-3d;
        perspective: 1000px;
      }
      .card-3d-inner {
        transform-style: preserve-3d;
        transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'brand-bg-dark': '#212D2D',
              'brand-bg-secondary': '#363F3A',
              'brand-text-heading': '#66726B',
              'brand-border': '#40423B',
              'brand-text-light': '#CED4CF',
              'brand-accent': '#8F9B93',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            boxShadow: {
              'glow': '0 0 15px 5px rgba(102, 114, 107, 0.1)',
              'glow-hover': '0 0 25px 8px rgba(102, 114, 107, 0.15)',
              'glow-neon': '0 0 5px #8F9B93, 0 0 10px #8F9B93',
            }
          }
        }
      }
    </script>
